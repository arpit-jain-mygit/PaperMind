<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoF Quiz - Answer Sheet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 24px;
            color: #667eea;
            font-weight: bold;
            margin-top: 10px;
        }

        .score-display.excellent {
            color: #27ae60;
        }

        .score-display.good {
            color: #3498db;
        }

        .score-display.needs-improvement {
            color: #e74c3c;
        }

        .feedback {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            color: #555;
        }

        .answer-block {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .answer-block:last-child {
            border-bottom: none;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 16px;
            color: #222;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .your-answer {
            background: #e8f5e9;
            border-left: 4px solid #27ae60;
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            color: #2e7d32;
            font-weight: 500;
        }

        .your-answer.incorrect {
            background: #ffebee;
            border-left-color: #e74c3c;
            color: #c62828;
        }

        .correct-answer {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            color: #333;
            font-weight: 500;
        }

        .explanation {
            background: #fafafa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            border: 1px solid #eee;
        }

        .option-explanation {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        .option-explanation:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .option-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
        }

        .option-label.correct {
            color: #27ae60;
        }

        .option-label.incorrect {
            color: #e74c3c;
        }

        .check-icon {
            margin-right: 8px;
            font-size: 18px;
        }

        .option-text {
            color: #555;
            margin-bottom: 6px;
            margin-left: 26px;
        }

        .option-reason {
            color: #888;
            font-size: 14px;
            margin-left: 26px;
            font-style: italic;
            line-height: 1.5;
        }

        .button-group {
            margin-top: 40px;
            text-align: center;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button.secondary {
            background: #ddd;
            color: #333;
        }

        button.secondary:hover {
            background: #bbb;
        }

        .print-button {
            background: #27ae60;
        }

        .print-button:hover {
            box-shadow: 0 5px 20px rgba(39, 174, 96, 0.4);
        }

        @media print {
            body {
                background: white;
            }

            .button-group {
                display: none;
            }

            .container {
                box-shadow: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Answer Sheet & Detailed Explanations</h1>
            <div id="scoreDisplay"></div>
            <div id="feedbackDisplay"></div>
        </div>

        <div id="answersContainer"></div>

        <div class="button-group">
            <button class="secondary" onclick="window.location.href='gof-quiz.html'">Retake Quiz</button>
            <button class="print-button" onclick="window.print()">🖨️ Print Answers</button>
        </div>
    </div>

    <script>
        const answerData = {
            q1: {
                question: "Which patterns are CREATIONAL patterns (used to create objects)?",
                correctAnswers: ['a', 'c'],
                options: {
                    a: {
                        text: "Singleton and Factory",
                        correct: true,
                        reason: "✓ CORRECT: Both Singleton and Factory are creational patterns. Singleton ensures only one instance exists, and Factory creates objects without specifying exact classes."
                    },
                    b: {
                        text: "Observer and Strategy",
                        correct: false,
                        reason: "✗ WRONG: Observer and Strategy are BEHAVIORAL patterns, not creational. Observer notifies listeners, and Strategy selects algorithms at runtime."
                    },
                    c: {
                        text: "Builder and Prototype",
                        correct: true,
                        reason: "✓ CORRECT: Both Builder and Prototype are creational patterns. Builder constructs complex objects step-by-step, and Prototype copies existing objects."
                    },
                    d: {
                        text: "Adapter and Facade",
                        correct: false,
                        reason: "✗ WRONG: Adapter and Facade are STRUCTURAL patterns, not creational. They organize how objects work together, not how they're created."
                    }
                }
            },
            q2: {
                question: "Which of these scenarios best use the SINGLETON pattern?",
                correctAnswers: ['a', 'c'],
                options: {
                    a: {
                        text: "A database connection pool - only one connection should exist",
                        correct: true,
                        reason: "✓ CORRECT: Database connections are expensive to create. Singleton ensures only one connection exists, and the entire app shares it."
                    },
                    b: {
                        text: "Creating multiple user accounts - each user needs a separate instance",
                        correct: false,
                        reason: "✗ WRONG: User accounts require MULTIPLE instances (one per user). Singleton is for single, shared instances only."
                    },
                    c: {
                        text: "A logging system used by the entire application",
                        correct: true,
                        reason: "✓ CORRECT: Logging should go to ONE log file used by the entire system. Singleton ensures all components write to the same logger."
                    },
                    d: {
                        text: "A file manager that handles multiple file operations",
                        correct: false,
                        reason: "✗ WRONG: File managers handle multiple files, so they don't need Singleton. You might need multiple file handlers for different operations."
                    }
                }
            },
            q3: {
                question: "The BUILDER pattern is useful when:",
                correctAnswers: ['a', 'b', 'd'],
                options: {
                    a: {
                        text: "Creating objects with many optional parameters",
                        correct: true,
                        reason: "✓ CORRECT: Instead of House(a, b, c, d, e, f...), Builder lets you do House.builder().add(a).add(c).add(f).build()—much cleaner!"
                    },
                    b: {
                        text: "You want to construct complex objects step-by-step",
                        correct: true,
                        reason: "✓ CORRECT: Builder's entire purpose is step-by-step construction. Like building a pizza topping by topping."
                    },
                    c: {
                        text: "Copying an existing object and modifying it slightly",
                        correct: false,
                        reason: "✗ WRONG: That's the PROTOTYPE pattern, not Builder. Prototype copies existing objects; Builder constructs from scratch."
                    },
                    d: {
                        text: "Avoiding massive constructors with many parameters",
                        correct: true,
                        reason: "✓ CORRECT: Builder solves the 'constructor hell' problem where you have 10+ parameters. It provides a fluent interface instead."
                    }
                }
            },
            q4: {
                question: "Which STRUCTURAL patterns are about hiding or managing complexity?",
                correctAnswers: ['a', 'b', 'c'],
                options: {
                    a: {
                        text: "Facade - hides complex subsystems behind simple interface",
                        correct: true,
                        reason: "✓ CORRECT: Facade is specifically designed to hide complexity. Like a car dashboard hiding engine complexity."
                    },
                    b: {
                        text: "Proxy - acts as a stand-in for the real object",
                        correct: true,
                        reason: "✓ CORRECT: Proxy can add security checks, caching, or logging before accessing the real object—manages complexity by controlling access."
                    },
                    c: {
                        text: "Decorator - adds features without changing the original object",
                        correct: true,
                        reason: "✓ CORRECT: Decorator manages complexity by wrapping objects with additional features. Like adding toppings to coffee without changing the coffee itself."
                    },
                    d: {
                        text: "Command - wraps actions as objects",
                        correct: false,
                        reason: "✗ WRONG: Command is a BEHAVIORAL pattern. It wraps actions for undo/redo, not for managing complexity of objects."
                    }
                }
            },
            q5: {
                question: "The ADAPTER pattern is used when:",
                correctAnswers: ['a', 'c', 'd'],
                options: {
                    a: {
                        text: "You have incompatible interfaces that need to work together",
                        correct: true,
                        reason: "✓ CORRECT: Adapter's core purpose is making incompatible interfaces compatible. Like connecting old and new systems."
                    },
                    b: {
                        text: "You want to add new features to an object dynamically",
                        correct: false,
                        reason: "✗ WRONG: That's DECORATOR, not Adapter. Decorator adds features; Adapter converts interfaces."
                    },
                    c: {
                        text: "You need a USB adapter to connect old devices to new ports",
                        correct: true,
                        reason: "✓ CORRECT: This is the REAL-WORLD example of Adapter! USB-C adapter connects old Micro-USB devices to new phones."
                    },
                    d: {
                        text: "Old code expects one interface but you have a different one",
                        correct: true,
                        reason: "✓ CORRECT: Adapter bridges the gap between old code interface and new implementation interface. Keeps old code working without modification."
                    }
                }
            },
            q6: {
                question: "Which BEHAVIORAL patterns help with communication between objects?",
                correctAnswers: ['a', 'b', 'c'],
                options: {
                    a: {
                        text: "Observer - notifies multiple listeners when something changes",
                        correct: true,
                        reason: "✓ CORRECT: Observer is all about communication. One object changes, notifies many listeners. Like YouTube subscriptions."
                    },
                    b: {
                        text: "Mediator - central hub for object communication",
                        correct: true,
                        reason: "✓ CORRECT: Mediator centralizes communication. Objects talk through the mediator instead of directly. Like an airport control tower."
                    },
                    c: {
                        text: "Chain of Responsibility - passes requests through handlers",
                        correct: true,
                        reason: "✓ CORRECT: Chain passes messages through a chain of handlers. Communication flows through the chain until someone handles it."
                    },
                    d: {
                        text: "Visitor - adds operations to objects without changing them",
                        correct: false,
                        reason: "✗ WRONG: Visitor is about adding operations, not about communication between objects. It visits objects to perform actions."
                    }
                }
            },
            q7: {
                question: "The DECORATOR pattern differs from inheritance because it:",
                correctAnswers: ['a', 'b', 'c'],
                options: {
                    a: {
                        text: "Allows adding features dynamically at runtime",
                        correct: true,
                        reason: "✓ CORRECT: With inheritance, you need to know classes at compile time. Decorator lets you wrap objects at runtime. Like adding toppings while making coffee."
                    },
                    b: {
                        text: "Wraps the original object instead of creating subclasses",
                        correct: true,
                        reason: "✓ CORRECT: Inheritance creates subclasses (RedCar, RedCars). Decorator wraps (Car wrapped with Red). Much more flexible!"
                    },
                    c: {
                        text: "Avoids creating explosion of subclass combinations",
                        correct: true,
                        reason: "✓ CORRECT: With inheritance, you'd need RedLeatherCar, RedSunroofCar, BlueLeatherCar, etc. Decorator avoids this combinatorial explosion."
                    },
                    d: {
                        text: "Makes the code more readable and maintainable",
                        correct: false,
                        reason: "✗ WRONG: While Decorator can be elegant, the MAIN difference from inheritance is dynamism and avoiding class explosion, not readability."
                    }
                }
            },
            q8: {
                question: "Which scenario best uses the STRATEGY pattern?",
                correctAnswers: ['a', 'b', 'c'],
                options: {
                    a: {
                        text: "Multiple sorting algorithms that can be chosen at runtime",
                        correct: true,
                        reason: "✓ CORRECT: QuickSort vs MergeSort—different strategies for sorting. Choose based on data size or type."
                    },
                    b: {
                        text: "Different payment methods (credit card, PayPal, Bitcoin)",
                        correct: true,
                        reason: "✓ CORRECT: Each payment method is a strategy. Choose at checkout time. Same interface, different implementations."
                    },
                    c: {
                        text: "Selecting a route on Google Maps (fastest, scenic, cheapest)",
                        correct: true,
                        reason: "✓ CORRECT: Perfect example! Each route is a strategy. Choose algorithm based on user preference."
                    },
                    d: {
                        text: "Ensuring only one instance of a class exists",
                        correct: false,
                        reason: "✗ WRONG: That's SINGLETON, not Strategy. Singleton ensures one instance; Strategy chooses algorithms."
                    }
                }
            },
            q9: {
                question: "The COMPOSITE pattern is useful for:",
                correctAnswers: ['a', 'b', 'c'],
                options: {
                    a: {
                        text: "Treating individual items and groups of items the same way",
                        correct: true,
                        reason: "✓ CORRECT: Core principle of Composite. Whether dealing with a file or folder, you can 'open' both the same way."
                    },
                    b: {
                        text: "Representing tree-like structures (file systems, UI components)",
                        correct: true,
                        reason: "✓ CORRECT: Composite is perfect for trees. Nodes can be leaves or branches, treated uniformly."
                    },
                    c: {
                        text: "File folders containing files and subfolders",
                        correct: true,
                        reason: "✓ CORRECT: Classic Composite example. A folder can contain files or other folders. You can operate on both uniformly."
                    },
                    d: {
                        text: "Saving and restoring object states",
                        correct: false,
                        reason: "✗ WRONG: That's MEMENTO, not Composite. Memento saves/restores states; Composite organizes hierarchies."
                    }
                }
            },
            q10: {
                question: "Which statement about the STATE pattern is correct?",
                correctAnswers: ['a', 'b', 'c'],
                options: {
                    a: {
                        text: "An object changes its behavior based on its internal state",
                        correct: true,
                        reason: "✓ CORRECT: That's the entire purpose of State. Same object, different behaviors per state."
                    },
                    b: {
                        text: "Avoids large if-else chains checking state",
                        correct: true,
                        reason: "✓ CORRECT: Instead of if(state==Red)stop, if(state==Green)go, State encapsulates each state as a separate class."
                    },
                    c: {
                        text: "Example: Traffic light (red stops, green goes)",
                        correct: true,
                        reason: "✓ CORRECT: Perfect State example. Same traffic light, different behaviors per state."
                    },
                    d: {
                        text: "Used to implement undo/redo functionality",
                        correct: false,
                        reason: "✗ WRONG: That's COMMAND and MEMENTO patterns. State is about behavior changes, not undo/redo."
                    }
                }
            },
            q11: {
                question: "The COMMAND pattern is used for:",
                correctAnswers: ['a', 'b', 'c'],
                options: {
                    a: {
                        text: "Wrapping actions as objects (undo/redo functionality)",
                        correct: true,
                        reason: "✓ CORRECT: Command wraps actions. Keep history of commands, reverse them for undo!"
                    },
                    b: {
                        text: "Queueing and scheduling tasks",
                        correct: true,
                        reason: "✓ CORRECT: Treat commands as objects, add to queue, execute later. Perfect for task scheduling."
                    },
                    c: {
                        text: "Logging and auditing operations",
                        correct: true,
                        reason: "✓ CORRECT: Commands can be logged for audit trails. You have a complete record of every action."
                    },
                    d: {
                        text: "Handling multiple types of requests",
                        correct: false,
                        reason: "✗ WRONG: Command does wrap actions, but the key benefit isn't 'handling types'—it's about treating actions as objects for undo/queue/log."
                    }
                }
            },
            q12: {
                question: "Which patterns are related to creating families or groups of related objects?",
                correctAnswers: ['a', 'b'],
                options: {
                    a: {
                        text: "Abstract Factory - creates families of related objects",
                        correct: true,
                        reason: "✓ CORRECT: Abstract Factory creates FAMILIES. Like 'Modern furniture set' or 'Windows UI theme'—coordinated, related objects."
                    },
                    b: {
                        text: "Factory - creates individual objects",
                        correct: true,
                        reason: "✓ CORRECT: Factory creates individual objects. Ask for 'Car', get one Car. Simple, singular."
                    },
                    c: {
                        text: "Prototype - copies existing objects",
                        correct: false,
                        reason: "✗ WRONG: Prototype creates by copying, not families. It's about cloning one object, not creating coordinated groups."
                    },
                    d: {
                        text: "Builder - step-by-step construction",
                        correct: false,
                        reason: "✗ WRONG: Builder constructs ONE complex object step-by-step, not families. It's about process, not relationships."
                    }
                }
            },
            q13: {
                question: "The FLYWEIGHT pattern's main benefit is:",
                correctAnswers: ['a', 'b', 'c'],
                options: {
                    a: {
                        text: "Saving memory by sharing common data across many objects",
                        correct: true,
                        reason: "✓ CORRECT: Flyweight's entire purpose is memory optimization. Share intrinsic state across many objects."
                    },
                    b: {
                        text: "Storing one object and reusing it many times",
                        correct: true,
                        reason: "✓ CORRECT: Store one tree model, use it 10,000 times at different positions. Massive memory savings!"
                    },
                    c: {
                        text: "Useful for games with thousands of similar objects",
                        correct: true,
                        reason: "✓ CORRECT: Games use Flyweight for particles, terrain tiles, enemies—thousands of similar objects sharing same model."
                    },
                    d: {
                        text: "Ensuring an object can only be created once",
                        correct: false,
                        reason: "✗ WRONG: That's SINGLETON. Flyweight creates many objects, just shares their data. Opposite of Singleton!"
                    }
                }
            },
            q14: {
                question: "Which BEHAVIORAL patterns help with decision-making or control flow?",
                correctAnswers: ['a', 'b', 'c', 'd'],
                options: {
                    a: {
                        text: "Strategy - choose algorithm at runtime",
                        correct: true,
                        reason: "✓ CORRECT: Strategy encapsulates decision logic. Which sorting algorithm? Which route? Choose at runtime."
                    },
                    b: {
                        text: "State - change behavior based on state",
                        correct: true,
                        reason: "✓ CORRECT: State encapsulates state-dependent behavior. If red, stop. If green, go. Behavior based on state."
                    },
                    c: {
                        text: "Chain of Responsibility - pass through handlers",
                        correct: true,
                        reason: "✓ CORRECT: Chain decides who handles what. Request flows through chain until someone can handle it."
                    },
                    d: {
                        text: "Template Method - define skeleton, vary details",
                        correct: true,
                        reason: "✓ CORRECT: Template Method defines algorithm skeleton, subclasses vary details. Controls flow at macro level."
                    }
                }
            },
            q15: {
                question: "Which patterns help with traversing or iterating through collections?",
                correctAnswers: ['a', 'b', 'c'],
                options: {
                    a: {
                        text: "Iterator - access elements without knowing internal structure",
                        correct: true,
                        reason: "✓ CORRECT: Iterator's purpose is to traverse collections uniformly. Works with array, linked list, or database—user doesn't care."
                    },
                    b: {
                        text: "Visitor - add operations to objects",
                        correct: true,
                        reason: "✓ CORRECT: Visitor traverses structures and applies operations. 'Visit' each node and do something with it."
                    },
                    c: {
                        text: "Composite - treat items and groups uniformly",
                        correct: true,
                        reason: "✓ CORRECT: Composite structures can be traversed like trees. Works with files and folders uniformly."
                    },
                    d: {
                        text: "Observer - notify multiple listeners",
                        correct: false,
                        reason: "✗ WRONG: Observer is about notifications, not traversal. It sends messages to listeners, doesn't iterate through them."
                    }
                }
            }
        };

        function displayResults() {
            const userAnswersStr = localStorage.getItem('userAnswers');
            const userAnswers = JSON.parse(userAnswersStr);
            const score = parseInt(localStorage.getItem('quizScore'));
            const total = parseInt(localStorage.getItem('quizTotal'));
            const percentage = Math.round((score / total) * 100);

            let feedbackText = '';
            let scoreClass = '';

            if (percentage >= 80) {
                feedbackText = "🎉 Excellent! You have a strong understanding of GoF patterns!";
                scoreClass = 'excellent';
            } else if (percentage >= 60) {
                feedbackText = "👍 Good job! You understand most GoF patterns. Review the incorrect answers for deeper learning.";
                scoreClass = 'good';
            } else {
                feedbackText = "📚 Keep learning! Review all patterns and their use cases carefully.";
                scoreClass = 'needs-improvement';
            }

            document.getElementById('scoreDisplay').innerHTML = `
                <div class="score-display ${scoreClass}">
                    Score: ${score}/${total} (${percentage}%)
                </div>
                <div class="feedback">${feedbackText}</div>
            `;

            const answersContainer = document.getElementById('answersContainer');
            answersContainer.innerHTML = '';

            for (let i = 1; i <= total; i++) {
                const qKey = 'q' + i;
                const data = answerData[qKey];
                const userAnswer = userAnswers[i - 1];
                const correctAnswers = data.correctAnswers;

                const isCorrect =
                    userAnswer.length === correctAnswers.length &&
                    userAnswer.every(ans => correctAnswers.includes(ans));

                const answerBlock = document.createElement('div');
                answerBlock.className = 'answer-block';

                let optionsExplanation = '<div class="explanation"><div style="margin-bottom: 15px; font-weight: bold; color: #333;">Why each option is right or wrong:</div><div class="option-explanation">';

                for (const optionKey of ['a', 'b', 'c', 'd']) {
                    const option = data.options[optionKey];
                    const isSelected = userAnswer.includes(optionKey);
                    const isCorrectOption = correctAnswers.includes(optionKey);

                    const icon = isCorrectOption ? '✓' : '✗';
                    const labelClass = isCorrectOption ? 'correct' : 'incorrect';

                    optionsExplanation += `
                        <div class="option-explanation">
                            <div class="option-label ${labelClass}">
                                <span class="check-icon">${icon}</span> Option ${optionKey.toUpperCase()}
                            </div>
                            <div class="option-text">${option.text}</div>
                            <div class="option-reason">${option.reason}</div>
                        </div>
                    `;
                }

                optionsExplanation += '</div></div>';

                let yourAnswerHTML = '';
                if (userAnswer.length === 0) {
                    yourAnswerHTML = '<div class="your-answer incorrect">⚠️ No answer selected</div>';
                } else {
                    const selectedText = userAnswer.map(a => `Option ${a.toUpperCase()}`).join(', ');
                    yourAnswerHTML = `<div class="your-answer ${isCorrect ? '' : 'incorrect'}">
                        ${isCorrect ? '✓' : '✗'} Your answer: ${selectedText}
                    </div>`;
                }

                const correctAnswerText = correctAnswers.map(a => `Option ${a.toUpperCase()}`).join(', ');
                const correctAnswerHTML = `<div class="correct-answer">✓ Correct answer(s): ${correctAnswerText}</div>`;

                answerBlock.innerHTML = `
                    <div class="question-number">Question ${i}</div>
                    <div class="question-text">${data.question}</div>
                    ${yourAnswerHTML}
                    ${correctAnswerHTML}
                    ${optionsExplanation}
                `;

                answersContainer.appendChild(answerBlock);
            }
        }

        displayResults();
    </script>
</body>
</html>
